CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_BT=y
CONFIG_BT_ISO_BROADCASTER=y
CONFIG_BT_ISO_SYNC_RECEIVER=y
CONFIG_BT_ISO_CENTRAL=y
CONFIG_BT_ISO_PERIPHERAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Nordic_ISO"

CONFIG_BT_MAX_CONN=5

# One BIS per receiver: broadcaster + seven independent receiver nodes.
CONFIG_BT_ISO_MAX_CHAN=8
CONFIG_BT_ISO_TX_BUF_COUNT=8
CONFIG_BT_CTLR_SDC_ISO_TX_HCI_BUFFER_COUNT=8
CONFIG_BT_CTLR_ADV_ISO_STREAM_COUNT=8
CONFIG_BT_CTLR_SYNC_ISO_STREAM_COUNT=8
CONFIG_BT_CTLR_SDC_PERIPHERAL_COUNT=1


CONFIG_BT_CTLR_CONN_ISO_STREAMS=4

# Host TX buffer capacity; must be >= SDU_SIZE_BYTES (9). 16 leaves headroom.
CONFIG_BT_ISO_TX_MTU=16

# Controller-timestamped presentation; keep host processing well before the deadline.
# Note: the presentation delay must also satisfy ts_offset + delay < SDU interval.
# The sync receiver processes an SDU ~3 ms before its timestamp, so the trigger
# must be armed less than one interval ahead or it gets overwritten by the next
# SDU before it ever fires. With the minimum ISO interval (5 ms) the upper bound
# is ~2000 us, so PD=1500 us leaves ~0.5 ms margin. Do NOT raise PD further:
# the next SDU re-arms the GRTC compare 5 ms after this one, and a larger PD
# would be overwritten before it fires. The margin is instead protected by
# keeping the RX/TX callbacks short (logging is deferred to a low-priority
# thread, see src/sync_log.c).
CONFIG_SDU_INTERVAL_US=5000
CONFIG_TIMED_LED_PRESENTATION_DELAY_US=1500
# Disable host GPIO toggles during precision captures.
# CONFIG_LED_TOGGLE_IMMEDIATELY_ON_SEND_OR_RECEIVE is not set
CONFIG_BT_ISO_RX_MTU=23

CONFIG_NRFX_GPPI=y

# On-chip TEMP for the temperature-adaptive servo process noise. The temp
# node is enabled in boards/nrf54l15dk_nrf54l15_cpuapp.overlay; with it,
# CONFIG_TEMP_NRF5 and CONFIG_TIME_SYNC_TEMP_COMP default to y.
CONFIG_SENSOR=y

CONFIG_CONSOLE=y
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_HANDLER=y
CONFIG_CONSOLE_GETCHAR=y
